<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Issue Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Issue Tracker" />
  <script>try{var t=localStorage.getItem('it.theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="css/mobile-nav.css" />
  <link rel="stylesheet" href="css/features.css" />
</head>
<body>
  <!-- app.html is just the entry point into the shell. The shell itself is
       rendered by js/layout.js on every page under pages/. -->
  <main class="auth-view">
    <section class="card auth-card">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-name">Issue Tracker</span>
      </div>
      <h1>Opening your dashboard…</h1>
      <p class="muted">If nothing happens, <a href="pages/dashboard.html">click here</a>.</p>
    </section>
  </main>
  <script src="js/supabase.js"></script>
  <script>
    (function () {
      var sb = window.ET && window.ET.getClient ? window.ET.getClient() : null;
      if (!sb || !window.ET.isConfigured()) { location.replace('index.html'); return; }
      sb.auth.getSession().then(function (res) {
        var s = res.data && res.data.session;
        location.replace(s && s.user ? 'pages/dashboard.html' : 'index.html');
      }).catch(function () { location.replace('index.html'); });
    })();
  </script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
