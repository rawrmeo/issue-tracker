<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Done issues ? Issue Tracker</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <meta name="theme-color" content="#1F6F9C" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Issue Tracker" />
  <link rel="icon" type="image/svg+xml" href="../logo.svg" />
  <script>try{var t=localStorage.getItem('it.theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <!-- ADDED: admin-only status sidebar styles -->
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/mobile-nav.css" />
  <link rel="stylesheet" href="../css/features.css" />
</head>
<body class="admin-page" data-admin-status="done">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="page-content">
        <div id="roleBanner" class="banner" hidden></div>

        <!-- ============ MOVED from index.html: add / edit issue form ======= -->
        <section class="card panel" id="issueFormPanel">
          <div class="panel-head">
            <h2 id="formTitle">Report an issue</h2>
            <p class="muted" id="formHint">Issues are added manually. Fill in the title and save.</p>
          </div>

          <form id="issueForm" class="issue-form">
            <label class="field">
              <span>Title <em>*</em></span>
              <input id="issueTitle" type="text" placeholder="e.g. Login button does nothing on mobile" required maxlength="140" />
            </label>

            <label class="field">
              <span>Description</span>
              <textarea id="issueDescription" rows="3" placeholder="Steps to reproduce, expected result, notes…" maxlength="2000"></textarea>
            </label>

            <div class="row">
              <label class="field">
                <span>Priority</span>
                <select id="issuePriority">
                  <option value="low">Low</option>
                  <option value="medium" selected>Medium</option>
                  <option value="high">High</option>
                </select>
              </label>

              <!-- Only admins may set the status directly -->
              <label class="field" id="statusField" hidden>
                <span>Status <small class="muted">(admin)</small></span>
                <select id="issueStatus">
                  <option value="pending" selected>Pending</option>
                  <option value="fixing">Fixing</option>
                  <option value="done">Done</option>
                </select>
              </label>

              <label class="field">
                <span>Label <small class="muted">(optional)</small></span>
                <input id="issueLabel" type="text" placeholder="bug, feature, docs…" maxlength="40" />
              </label>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn primary" id="issueSubmit">Report issue</button>
              <button type="button" class="btn ghost" id="issueCancel" hidden>Cancel edit</button>
            </div>
          </form>
        </section>

        <!-- ============ MOVED from index.html: the filter row ============== -->
        <section class="toolbar">
          <div class="search">
            <input type="search" id="searchInput" placeholder="Search title, description, label, reporter…" />
          </div>

          <div class="filters">
            <div class="segmented" role="group" aria-label="Filter by status">
              <button type="button" class="seg active" data-filter="status" data-value="all">All</button>
              <button type="button" class="seg" data-filter="status" data-value="pending">Pending</button>
              <button type="button" class="seg" data-filter="status" data-value="fixing">Fixing</button>
              <button type="button" class="seg" data-filter="status" data-value="done">Done</button>
            </div>

            <select id="priorityFilter" aria-label="Filter by priority">
              <option value="all">All priorities</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>

            <select id="sortSelect" aria-label="Sort issues">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="priority">Priority</option>
              <option value="title">Title (A–Z)</option>
            </select>

            <!-- Export used to live in the old topbar; it now belongs here -->
            <button type="button" class="btn ghost admin-only" id="exportBtn" title="Download the issues as JSON">Export</button>
            <button type="button" class="btn ghost danger admin-only" id="clearDoneBtn">Clear done</button>
            <button type="button" class="btn ghost" id="refreshBtn" title="Reload from the database">Refresh</button>
          </div>
        </section>

        <!-- ============ MOVED from index.html: issue list ================== -->
        <section id="issueList" class="issue-list" aria-live="polite"></section>

        <div id="emptyState" class="empty" hidden>
          <div class="empty-icon">🗂️</div>
          <h3 id="emptyTitle">No issues yet</h3>
          <p class="muted" id="emptyText">Report your first issue using the form above.</p>
        </div>
      </main>
    </div>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="../js/install.js"></script>
  <script src="../js/push.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <!-- ADDED: admin-only status sidebar. Must load after layout.js and before
       page-issues.js, which calls layout.render(). -->
  <script src="../js/sidebar.js"></script>
  <script src="../js/page-issues.js"></script>
  <!-- ADDED: applies this page's status filter + Done confirmation -->
  <script src="../js/page-admin.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("../sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
