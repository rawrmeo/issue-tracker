<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reports · Issue Tracker</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Issue Tracker" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Cpath d='M28 52l15 15 30-32' stroke='white' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script>try{var t=localStorage.getItem('it.theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../enhancements.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/mobile-nav.css" />
  <link rel="stylesheet" href="../css/features.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="page-content">
        <div class="page-head">
          <h2>Reports</h2>
          <p>Filter the issues by date, then export exactly what you need.</p>
        </div>

        <section class="card panel">
          <div class="panel-head">
            <h2>Filter by date</h2>
            <p class="muted">Pick a day, a month or a year — or a custom range.</p>
          </div>

          <div class="et-presets" id="repPresets" role="group" aria-label="Date presets">
            <button type="button" class="et-chip" data-preset="today">Today</button>
            <button type="button" class="et-chip" data-preset="week">This Week</button>
            <button type="button" class="et-chip" data-preset="month">This Month</button>
            <button type="button" class="et-chip" data-preset="lastmonth">Last Month</button>
            <button type="button" class="et-chip" data-preset="year">This Year</button>
          </div>

          <div class="report-filters">
            <label class="field">
              <span>Month</span>
              <input type="month" id="repMonth" />
            </label>

            <label class="field">
              <span>From</span>
              <input type="date" id="repFrom" />
            </label>

            <label class="field">
              <span>To</span>
              <input type="date" id="repTo" />
            </label>

            <label class="field">
              <span>Status</span>
              <select id="repStatus">
                <option value="all">All statuses</option>
                <option value="pending">Pending</option>
                <option value="fixing">Fixing</option>
                <option value="done">Done</option>
              </select>
            </label>

            <label class="field">
              <span>Priority</span>
              <select id="repPriority">
                <option value="all">All priorities</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
              </select>
            </label>

            <label class="field">
              <span>Search</span>
              <input type="search" id="repSearch" placeholder="Title, description, reporter…" />
            </label>

            <button type="button" class="btn ghost" id="repClear">Clear filters</button>
          </div>

          <p class="muted small" id="repRange">Showing every issue.</p>
        </section>

        <section class="card panel">
          <div class="panel-head">
            <h2>Preview <span class="muted" id="repCount">0</span></h2>
            <p class="muted">This is exactly what gets exported.</p>
          </div>

          <div class="card-row">
            <button type="button" class="btn primary" id="repCsv">Download CSV</button>
            <button type="button" class="btn" id="repJson">Download JSON</button>
            <button type="button" class="btn ghost" id="repPrint">Print / Save as PDF</button>
          </div>

          <div id="repTable" class="report-table-wrap"></div>
        </section>
      </main>
    </div>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="../js/install.js"></script>
  <script src="../js/push.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/page-reports.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("../sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
