<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile · Issue Tracker</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Issue Tracker" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Cpath d='M28 52l15 15 30-32' stroke='white' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script>try{var t=localStorage.getItem('it.theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <!-- ADDED: admin-only sidebar + role badge -->
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/mobile-nav.css" />
  <link rel="stylesheet" href="../css/features.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="page-content">
        <div class="page-head" style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
          <span class="avatar" id="profileAvatar" style="width:48px;height:48px;font-size:1.1rem">U</span>
          <div>
            <h2>Profile</h2>
            <p>Your account details.</p>
          </div>
        </div>

        <section class="card panel">
          <div class="profile-list">
            <div class="profile-item">
              <span class="label">Username</span>
              <span class="value" id="profileName">—</span>
            </div>
            <div class="profile-item">
              <span class="label">Role</span>
              <span class="value" id="profileRole">—</span>
            </div>
            <div class="profile-item">
              <span class="label">Email (masked)</span>
              <span class="value mono" id="profileEmail">—</span>
            </div>
            <div class="profile-item">
              <span class="label">Joined</span>
              <span class="value" id="profileJoined">—</span>
            </div>
            <div class="profile-item">
              <span class="label">Account ID</span>
              <span class="value mono small" id="profileId">—</span>
            </div>
          </div>
        </section>

        <section class="card panel">
          <div class="panel-head">
            <h2>Change password</h2>
            <p class="muted">You stay signed in after changing it.</p>
          </div>

          <form id="passwordForm" class="form">
            <div class="row">
              <label class="field">
                <span>Current password</span>
                <input id="currentPassword" type="password" required autocomplete="current-password" />
              </label>
              <label class="field">
                <span>New password</span>
                <input id="newPassword" type="password" required minlength="6" autocomplete="new-password" />
              </label>
              <label class="field">
                <span>Confirm new password</span>
                <input id="confirmPassword" type="password" required minlength="6" autocomplete="new-password" />
              </label>
            </div>
            <p id="passwordError" class="alert error" role="alert" hidden></p>
            <p id="passwordOk" class="alert ok" role="status" hidden></p>
            <div class="form-actions">
              <button type="submit" class="btn primary" id="passwordSubmit">Update password</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="../js/install.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <!-- ADDED: admin-only sidebar (renders only for admins) -->
  <script src="../js/sidebar.js"></script>
  <script src="../js/page-profile.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("../sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
