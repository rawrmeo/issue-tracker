<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Issues" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <title>Recycle bin · Issue Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Cpath d='M28 52l15 15 30-32' stroke='white' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script>try{if(localStorage.getItem('it.theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <!-- ADDED: admin-only sidebar + role badge -->
  <link rel="stylesheet" href="../css/sidebar.css" />
</head>
<body class="admin-page">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="page-content">
        <div class="page-head">
          <h2>Recycle bin</h2>
          <p>Deleting an issue only moves it here. Nothing is destroyed until you say so.</p>
        </div>

        <section class="card panel">
          <div class="panel-head">
            <h2>Deleted issues <span class="muted" id="binCount">0</span></h2>
            <p class="muted">
              <strong>Restore</strong> puts an issue back on the board with its status and
              history intact. <strong>Delete for good</strong> removes it permanently — that
              one cannot be undone.
            </p>
          </div>

          <div class="user-actions" style="display:flex;gap:.6rem;flex-wrap:wrap;">
            <button class="btn" type="button" id="refreshBtn">Refresh</button>
            <button class="btn danger" type="button" id="emptyBtn">Empty recycle bin</button>
          </div>

          <p class="inline-note" id="binStatus" role="status"></p>
        </section>

        <section class="card panel">
          <div id="binList" class="user-list"></div>
        </section>
      </main>
    </div>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <!-- ADDED: admin-only sidebar (renders only for admins) -->
  <script src="../js/sidebar.js"></script>
  <script src="../js/page-admin-recyclebin.js"></script>
<script>
  /* Installable, and works offline. Registered last; only the shell is cached. */
  (function () {
    if (!('serviceWorker' in navigator)) return;
    if (!(location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) return;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('../sw.js').catch(function () {});
    });
  })();
</script>
</body>
</html>
