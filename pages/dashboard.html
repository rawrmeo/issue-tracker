<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · Issue Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Cpath d='M28 52l15 15 30-32' stroke='white' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script>try{if(localStorage.getItem('it.theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <!-- ADDED: admin-only sidebar + role badge -->
  <link rel="stylesheet" href="../css/sidebar.css" />
</head>
<body>
  <div class="app-shell">
    <!-- filled by js/layout.js -->
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <!-- filled by js/layout.js -->
      <header class="topbar" id="topbar"></header>

      <main class="page-content">
        <div class="page-head">
          <h2>Overview</h2>
          <p id="dashGreeting">Loading…</p>
        </div>

        <!-- Stat cards: markup reused verbatim from the old index.html -->
        <section class="stats" aria-label="Summary">
          <article class="stat">
            <span class="stat-value" id="statTotal">0</span>
            <span class="stat-label">Total</span>
          </article>
          <article class="stat pending">
            <span class="stat-value" id="statPending">0</span>
            <span class="stat-label">Pending</span>
          </article>
          <article class="stat fixing">
            <span class="stat-value" id="statFixing">0</span>
            <span class="stat-label">Fixing</span>
          </article>
          <article class="stat done">
            <span class="stat-value" id="statDone">0</span>
            <span class="stat-label">Done</span>
          </article>
          <article class="stat high">
            <span class="stat-value" id="statHigh">0</span>
            <span class="stat-label">High priority</span>
          </article>
        </section>

        <section class="card panel">
          <div class="panel-head">
            <h2>Issues per month</h2>
            <p class="muted">Last 12 months</p>
          </div>
          <div class="chart-wrap">
            <canvas id="chartCanvas" role="img" aria-label="Issues created per month"></canvas>
            <div class="chart-empty" id="chartEmpty" hidden>
              <span style="font-size:1.5rem">📊</span>
              <span>No issues in the last 12 months yet.</span>
            </div>
          </div>
        </section>

        <section class="card panel">
          <div class="panel-head">
            <h2>Recent activity</h2>
            <p class="muted">The last 10 events</p>
          </div>
          <div class="activity-list" id="activityList"></div>
          <div class="empty" id="activityEmpty" hidden>
            <div class="empty-icon">🕓</div>
            <h3>Nothing yet</h3>
            <p class="muted">Activity appears here as issues are opened and closed.</p>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="../supabase-config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <!-- ADDED: admin-only sidebar (renders only for admins) -->
  <script src="../js/sidebar.js"></script>
  <script src="../js/page-dashboard.js"></script>
</body>
</html>
